<!-- ============ SCRIPTS ============ -->
<script>
    'use strict';

    /* ---- Sticky Navbar on Scroll ---- */
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', function () {
        if (window.scrollY > 60) {
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
        }
    });

    /* ---- Back to Top Button ---- */
    const backToTop = document.getElementById('backToTop');
    window.addEventListener('scroll', function () {
        if (window.scrollY > 400) {
            backToTop.classList.add('show');
        } else {
            backToTop.classList.remove('show');
        }
    });

    /* ---- Interactive Menu Button Controller ---- */
    const sidemenu = document.getElementById('sidemenu');
    const navMenuBtn = document.getElementById('navMenuBtn');

    function toggleMenu() {
        if (sidemenu && navMenuBtn) {
            sidemenu.classList.toggle('active');
            navMenuBtn.classList.toggle('active');
        }
    }

    function closemenu() {
        if (sidemenu) sidemenu.classList.remove('active');
        if (navMenuBtn) navMenuBtn.classList.remove('active');
    }

    document.querySelectorAll('#sidemenu li a').forEach(function (link) {
        link.addEventListener('click', closemenu);
    });

    document.addEventListener('click', function(e) {
        if (sidemenu && navMenuBtn && !sidemenu.contains(e.target) && !navMenuBtn.contains(e.target)) {
            closemenu();
        }
    });
</script>
